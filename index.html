<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="description" content="Sluggish: describe a website and watch AI build it live. Runs on free AI models." />
  <title>Sluggish · AI website builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23b6f35c'/%3E%3Cpath d='M12 12a1.5 1.5 0 0 1 1.5 1.5A3 3 0 0 1 10.5 16.5 4.5 4.5 0 0 1 6 12 6 6 0 0 1 12 6a7.5 7.5 0 0 1 7.5 7.5' fill='none' stroke='%230d1405' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 12a1.5 1.5 0 0 1 1.5 1.5A3 3 0 0 1 10.5 16.5 4.5 4.5 0 0 1 6 12 6 6 0 0 1 12 6a7.5 7.5 0 0 1 7.5 7.5"/></svg></span>
      <span class="brand-name">Sluggish</span>
    </div>
    <nav class="mtabs" aria-label="View">
      <button class="mtab active" data-view="chat" type="button">Chat</button>
      <button class="mtab" data-view="preview" type="button">Preview</button>
      <button class="mtab" data-view="code" type="button">Code</button>
    </nav>
    <div class="spacer"></div>
    <button id="newBtn" class="btn ghost" type="button" title="New project">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="label">New</span>
    </button>
    <button id="settingsBtn" class="btn" type="button" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span class="label">Settings</span>
    </button>
  </header>

  <main id="main" class="main" data-view="chat" data-work="preview">
    <section class="chat" aria-label="Chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="quick" class="quick" hidden></div>
      <form id="composer" class="composer" autocomplete="off">
        <div id="attachPreview" class="attach-preview" hidden></div>
        <textarea id="input" rows="1" placeholder="Describe the website you want…" aria-label="Message"></textarea>
        <div class="composer-row">
          <label class="btn icon ghost" title="Attach a screenshot or image">
            <input id="fileInput" type="file" accept="image/*" hidden />
            <svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </label>
          <button id="modelBadge" class="model-badge" type="button" title="Change AI model"></button>
          <div class="spacer"></div>
          <button id="stopBtn" class="btn" type="button" hidden>
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop
          </button>
          <button id="sendBtn" class="btn primary icon send" type="submit" title="Send">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </section>

    <section class="work" aria-label="Website">
      <div class="work-bar">
        <div class="seg wtabs">
          <button class="wtab active" data-view="preview" type="button">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Preview
          </button>
          <button class="wtab" data-view="code" type="button">
            <svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>Code
          </button>
        </div>
        <div class="seg devices">
          <button class="active" data-device="desktop" type="button" title="Desktop size" aria-label="Desktop size">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
          <button data-device="tablet" type="button" title="Tablet size" aria-label="Tablet size">
            <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          </button>
          <button data-device="mobile" type="button" title="Phone size" aria-label="Phone size">
            <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          </button>
        </div>
        <div class="spacer"></div>
        <div class="tools">
          <button id="undoBtn" class="btn icon ghost" type="button" title="Previous version" aria-label="Previous version">
            <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <span id="versionLabel" class="version-label"></span>
          <button id="redoBtn" class="btn icon ghost" type="button" title="Next version" aria-label="Next version">
            <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          </button>
          <span class="divider"></span>
          <button id="refreshBtn" class="btn icon ghost" type="button" title="Reload preview" aria-label="Reload preview">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <button id="copyBtn" class="btn icon ghost" type="button" title="Copy code" aria-label="Copy code">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button id="downloadBtn" class="btn icon ghost" type="button" title="Download HTML file" aria-label="Download HTML file">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          </button>
          <button id="openBtn" class="btn icon ghost" type="button" title="Open in a new tab" aria-label="Open in a new tab">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          </button>
        </div>
      </div>
      <div id="stage" class="stage" data-device="desktop">
        <div id="previewWrap" class="preview-wrap">
          <iframe id="preview" title="Website preview" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-popups-to-escape-sandbox"></iframe>
          <div id="emptyState" class="empty-state">
            <div class="empty-logo"><svg viewBox="0 0 24 24"><path d="M12 12a1.5 1.5 0 0 1 1.5 1.5A3 3 0 0 1 10.5 16.5 4.5 4.5 0 0 1 6 12 6 6 0 0 1 12 6a7.5 7.5 0 0 1 7.5 7.5"/></svg></div>
            <h2>Your website shows up here</h2>
            <p>Describe it in the chat, or attach a screenshot of a site you like.</p>
          </div>
        </div>
        <textarea id="code" class="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Website code" placeholder="The code shows up here. You can also edit it by hand."></textarea>
      </div>
    </section>
  </main>
</div>

<template id="welcomeTpl">
  <div class="welcome">
    <h1>What do you want to build?</h1>
    <p>Describe a website, app or game. Paste a screenshot to copy a design. Then keep chatting to change anything.</p>
    <div class="starters">
      <button type="button" class="starter" data-prompt="A landing page for a padel club: court booking, coaching programs for all levels, membership pricing and a tournament calendar">
        <strong>Padel club</strong><span>Court booking, coaching, membership pricing</span>
      </button>
      <button type="button" class="starter" data-prompt="A dark, premium barber shop website with services and prices, a photo gallery, customer reviews and a WhatsApp booking button">
        <strong>Barber shop</strong><span>Dark and premium, prices, WhatsApp booking</span>
      </button>
      <button type="button" class="starter" data-prompt="A restaurant website with a full menu with prices, opening hours, a location section and an online ordering button">
        <strong>Restaurant</strong><span>Menu, opening hours, ordering</span>
      </button>
      <button type="button" class="starter" data-prompt="A modern SaaS landing page for an AI note-taking app with features, pricing tiers, testimonials and an FAQ">
        <strong>SaaS landing page</strong><span>Features, pricing tiers, FAQ</span>
      </button>
      <button type="button" class="starter" data-prompt="A bold portfolio site for a freelance video editor with a showreel section, featured projects, client logos and a contact form">
        <strong>Portfolio</strong><span>Showreel, projects, contact form</span>
      </button>
      <button type="button" class="starter" data-prompt="A mobile-friendly mini game: tap the moving targets before the timer runs out, with a score, increasing levels and a game over screen">
        <strong>Mini game</strong><span>Tap targets, levels, works on phones</span>
      </button>
    </div>
  </div>
</template>

<dialog id="settingsDialog" class="dialog">
  <div class="dialog-inner">
    <div class="dialog-head">
      <h2>Settings</h2>
      <button type="button" class="btn icon ghost" data-close aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p id="settingsNotice" class="notice" hidden></p>

    <label class="field">
      <span>AI provider</span>
      <select id="providerSel"></select>
    </label>
    <p id="providerHint" class="hint"></p>

    <div class="field">
      <label for="keyInput" id="keyLabel">API key</label>
      <div class="input-row">
        <input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key here" />
        <button id="toggleKey" type="button" class="btn">Show</button>
      </div>
    </div>

    <div class="field">
      <label for="modelInput">Model</label>
      <div class="input-row">
        <input id="modelInput" list="modelList" autocomplete="off" spellcheck="false" />
        <button id="loadModelsBtn" type="button" class="btn">Check key &amp; load models</button>
      </div>
      <datalist id="modelList"></datalist>
      <p id="modelStatus" class="status-line"></p>
    </div>

    <details class="advanced">
      <summary>Advanced</summary>
      <label class="field">
        <span>API base URL</span>
        <input id="baseUrlInput" spellcheck="false" autocomplete="off" />
      </label>
      <label class="field">
        <span>Max output tokens (leave blank for automatic)</span>
        <input id="maxTokInput" inputmode="numeric" placeholder="automatic" autocomplete="off" />
      </label>
    </details>

    <p class="hint small">Your key is saved only in this browser and is sent only to the provider you pick.</p>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button id="saveSettings" type="button" class="btn primary">Save</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="prompt.js"></script>
<script src="app.js"></script>
</body>
</html>
